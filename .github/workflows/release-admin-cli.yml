name: Release admin-cli

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build admin-cli (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked --bin admin-cli
      - name: Package
        run: |
          mkdir -p artifacts
          bin_path="target/release/admin-cli"
          cp "$bin_path" "artifacts/admin-cli-${{ matrix.platform }}"
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/admin-cli-${{ matrix.platform }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
