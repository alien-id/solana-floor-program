name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    container: solanafoundation/anchor:v0.32.1

    steps:
      - uses: actions/checkout@v3
      - name: List rustup toolchains
        run: rustup toolchain list
      - name: Set default toolchain
        run: rustup default stable
      - name: List rustup toolchains
        run: rustup toolchain list
      - name: Generate keypair
        run: |
          mkdir -p $HOME/.config/solana
          solana-keygen new \
            --outfile $HOME/.config/solana/id.json \
            --no-bip39-passphrase --force
      - name: Fix blake3 compatibility
        run: cargo update -p blake3 --precise 1.8.2
      - name: Fix indexmap compatibility
        run: cargo update -p indexmap --precise 2.11.4
      - name: Set solana target cluster to local
        run: solana config set --url http:localhost:8899
      - name: Check solana config
        run: solana config get
      - name: Install yarn dependencies
        run: yarn install
      - name: Build
        run: anchor build
      - name: Run tests
        run: anchor test